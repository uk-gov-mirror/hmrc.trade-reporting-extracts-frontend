include "frontend.conf"

appName="trade-reporting-extracts-frontend"

play.http.router = prod.Routes

play.http.errorHandler = "handlers.ErrorHandler"

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"
play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
play.modules.enabled += "config.Module"

play.filters.enabled += play.filters.csp.CSPFilter

play-frontend-hmrc.forceServiceNavigation = true

play.i18n.langs = ["en", "cy"]

microservice {
    services {
      auth {
        protocol = http
        host     = localhost
        port     = 8500
      }

      feedback-frontend {
        protocol = http
        host     = localhost
        port     = 9514
      }

      trade-reporting-extracts {
        host = localhost
        port = 2100
        context = "/trade-reporting-extracts"
      }
    }
}

contact-frontend {
  host      = "http://localhost:9250"
  serviceId = "trade-reporting-extracts-frontend"
}

timeout-dialog {
  timeout   = 900
  countdown = 120
}

session {
  timeoutSeconds = 900
}

mongodb {
  uri                 = "mongodb://localhost:27017/"${appName}
  timeToLiveInSeconds = 900
}

urls {
  login         = "http://localhost:9949/auth-login-stub/gg-sign-in"
  loginContinue = "http://localhost:2102/request-customs-declaration-data/dashboard"
  signOut       = "http://localhost:9553/bas-gateway/sign-out-without-state"
  signOutContinue = "http://localhost:2102/request-customs-declaration-data/signed-out"
  cdsSubscribeUrl = "https://www.gov.uk/guidance/get-access-to-the-customs-declaration-service"
  guidanceWhatsInTheReportUrl = "https://www.gov.uk/guidance/get-customs-data-for-import-and-export-declarations#whats-in-the-reports"
  importsExportsContactUrl = "https://www.gov.uk/find-hmrc-contacts/imports-and-exports-enquiries"
  manageEmailGuideUrl = "https://www.gov.uk/guidance/manage-your-email-address-for-the-customs-declaration-service"
}

host = "http://localhost:2102"

accessibility-statement{
  service-path = "/request-customs-declaration-data"
}

tracking-consent-frontend {
  gtm.container = "transitional"
}

enrolment-config {
    enrolment-key = "HMRC-CUS-ORG"
    enrolment-identifier = "EORINumber"
}

play-frontend-hmrc {
    useRebrand = true
}

auditing {
    third-party-self-removal-event-name = "ThirdPartyRemovesOwnAccess"
    third-party-removal-event-name = "ThirdPartyAccessRemoved"
    third-party-added-event-name = "ThirdPartyAccessAdded"
    third-party-updated-event-name = "ThirdPartyAccessUpdated"
}

additional-email-limit = 5

crypto.key = "oQEDz0eLB29yN8637NK2p7yLC4mmJqfR2boDPMop1Tc="
